
name: dolphin-tap-local-smoke
description: Real camera/mic, passthrough backend -- UI/interaction smoke test only.

backend:
  name: passthrough

audio:
  sample_rate: 16000
  channels: 1
  chunk_samples: 320

video:
  fps: 30.0
  tracker: iou
  min_detection_confidence: 0.5
  iou_threshold: 0.3
  min_hits: 3
  attach_frame_bgr: false
  max_age: 30
  reid_window_ms: 2500.0

selection:
  mode: active_speaker
